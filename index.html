<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Юмилия — Галерея</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0e0d18;
  --bg2:#13112a;
  --pink:#e8649a;
  --border:rgba(232,100,154,0.2);
  --text:#e8e0f0;
  --muted:#7a6e8a;
}
body{
  background:var(--bg);
  background-image:radial-gradient(ellipse at 20% 0%,#1a0e2e 0%,transparent 60%),radial-gradient(ellipse at 80% 100%,#1a0826 0%,transparent 60%);
  color:var(--text);
  font-family:'Montserrat',sans-serif;
  font-weight:300;
  min-height:100vh;
  user-select:none;
  -webkit-user-select:none;
}
header{text-align:center;padding:3.5rem 1.5rem 0;}
.title-row{display:flex;align-items:center;justify-content:center;gap:1.2rem;margin-bottom:0.6rem;}
.tline{height:1px;width:80px;background:linear-gradient(to right,transparent,var(--pink));}
.tline.r{background:linear-gradient(to left,transparent,var(--pink));}
@media(max-width:480px){.tline{width:30px;}}
h1{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(3rem,12vw,5.5rem);
  font-weight:300;
  letter-spacing:0.25em;
  color:var(--text);
  line-height:1;
}
.subtitle{font-size:0.6rem;letter-spacing:0.35em;text-transform:uppercase;color:var(--muted);margin-bottom:1.5rem;}
.divider{width:1px;height:40px;background:linear-gradient(to bottom,var(--pink),transparent);margin:0 auto 2rem;}
.filter-pill{
  display:flex;align-items:center;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--border);
  border-radius:100px;
  padding:0.3rem;
  width:fit-content;
  margin:0 auto 3rem;
  gap:0.2rem;
}
.filter-pill button{
  background:none;border:none;
  font-family:'Montserrat',sans-serif;
  font-size:0.6rem;font-weight:400;
  letter-spacing:0.2em;text-transform:uppercase;
  color:var(--muted);
  padding:0.55rem 1.2rem;
  border-radius:100px;cursor:pointer;
  transition:all 0.25s;white-space:nowrap;
}
.filter-pill button.active{background:var(--pink);color:#fff;}
.filter-pill button:hover:not(.active){color:var(--text);}
main{max-width:1400px;margin:0 auto;padding:0 1rem 4rem;}
#gallery{columns:4;column-gap:10px;}
@media(max-width:1100px){#gallery{columns:3;}}
@media(max-width:720px){#gallery{columns:2;}}
@media(max-width:400px){#gallery{columns:1;}}
.item{break-inside:avoid;margin-bottom:10px;position:relative;overflow:hidden;cursor:pointer;border-radius:6px;background:var(--bg2);}
.item img,.item video{width:100%;display:block;transition:transform 0.5s cubic-bezier(0.16,1,0.3,1);}
.item:hover img,.item:hover video{transform:scale(1.04);}
.item .overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(14,13,24,0.5) 0%,transparent 60%);opacity:0;transition:opacity 0.3s;border-radius:6px;}
.item:hover .overlay{opacity:1;}
.gif-badge{position:absolute;top:0.5rem;right:0.5rem;font-size:0.55rem;letter-spacing:0.1em;padding:0.2rem 0.45rem;background:rgba(14,13,24,0.8);color:var(--pink);border:1px solid var(--pink);border-radius:3px;text-transform:uppercase;}
#empty{display:none;text-align:center;padding:5rem 1rem;flex-direction:column;align-items:center;gap:1rem;}
#empty.visible{display:flex;}
#empty .flower{font-size:2.5rem;opacity:0.5;}
#empty p{font-size:0.6rem;letter-spacing:0.25em;text-transform:uppercase;color:var(--muted);}
#loading{text-align:center;padding:4rem;font-size:0.6rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);}
#lightbox{display:none;position:fixed;inset:0;z-index:200;background:rgba(10,9,20,0.97);align-items:center;justify-content:center;}
#lightbox.open{display:flex;}
#lightbox img{max-width:92vw;max-height:88vh;object-fit:contain;border-radius:4px;}
#lightbox video{max-width:92vw;max-height:88vh;}
#lightbox-close{position:fixed;top:1.2rem;right:1.5rem;background:none;border:1px solid var(--border);color:var(--muted);font-family:'Montserrat',sans-serif;font-size:0.6rem;letter-spacing:0.15em;text-transform:uppercase;padding:0.4rem 0.9rem;border-radius:100px;cursor:pointer;transition:color 0.2s,border-color 0.2s;}
#lightbox-close:hover{color:var(--pink);border-color:var(--pink);}
footer{text-align:center;padding:2rem;font-size:0.58rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--border);}
</style>
</head>
<body>
<header>
  <div class="title-row">
    <div class="tline"></div>
    <h1>Юмилия</h1>
    <div class="tline r"></div>
  </div>
  <p class="subtitle">Галерея контента &nbsp;·&nbsp; Избранное</p>
  <div class="divider"></div>
  <div class="filter-pill">
    <button class="active" data-filter="all">Все</button>
    <button data-filter="image">Фото</button>
    <button data-filter="gif">GIF</button>
    <button data-filter="video">Видео</button>
  </div>
</header>
<main>
  <div id="loading">Загрузка — —</div>
  <div id="empty"><div class="flower">🌸</div><p>Фотографии появятся здесь</p></div>
  <div id="gallery"></div>
</main>
<div id="lightbox">
  <button id="lightbox-close">✕ закрыть</button>
  <img id="lightbox-img" style="display:none" oncontextmenu="return false" draggable="false">
  <video id="lightbox-vid" controls style="display:none"><source id="lightbox-vid-src" src="" type="video/mp4"></video>
</div>
<footer>🌸 &nbsp; Юмилия · Все права защищены</footer>
<script>
const CLOUD_NAME = 'dflgldw4j';
const FOLDER = 'gallery';

let allItems = [];
let activeFilter = 'all';

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('dragstart', e => e.preventDefault());

async function fetchMedia() {
  document.getElementById('loading').style.display = 'block';
  const seenUrls = new Set();
  const deletedUrls = new Set();
  const merged = [];
  let misses = 0;
  for (let v = 1; v <= 999; v++) {
    const vStr = String(v).padStart(3, '0');
    try {
      const resp = await fetch(`https://res.cloudinary.com/${CLOUD_NAME}/raw/upload/${FOLDER}/manifest_${vStr}.json?t=${Date.now()}`);
      if (resp.ok) {
        misses = 0;
        const data = await resp.json();
        for (const url of (data.deleted||[])) deletedUrls.add(url);
        for (const item of (data.items || [])) {
          if (!seenUrls.has(item.url)) { seenUrls.add(item.url); merged.push(item); }
        }
      } else {
        misses++;
        if (misses >= 3) break;
      }
    } catch(e) { misses++; if (misses >= 3) break; }
  }
  document.getElementById('loading').style.display = 'none';
  const finalItems = merged.filter(i => !deletedUrls.has(i.url));
  if (finalItems.length === 0) { document.getElementById('empty').classList.add('visible'); return; }
  allItems = finalItems;
  render();
}

function getType(item) {
  if (item.type) return item.type;
  const url = item.url || '';
  if (url.match(/\.gif$/i)) return 'gif';
  if (url.match(/\.(mp4|webm|mov)$/i)) return 'video';
  return 'image';
}

function render() {
  document.getElementById('loading').style.display = 'none';
  const gallery = document.getElementById('gallery');
  const empty = document.getElementById('empty');
  const filtered = activeFilter === 'all' ? allItems : allItems.filter(i => getType(i) === activeFilter);
  if (!filtered.length) { gallery.innerHTML = ''; empty.classList.add('visible'); return; }
  empty.classList.remove('visible');
  gallery.innerHTML = '';
  filtered.forEach(item => {
    const type = getType(item);
    const div = document.createElement('div');
    div.className = 'item';
    const mediaEl = type === 'video'
      ? `<video src="${item.url}" muted loop autoplay playsinline></video>`
      : `<img src="${item.url}" alt="" loading="lazy" draggable="false" oncontextmenu="return false">`;
    div.innerHTML = `${mediaEl}${type==='gif'?'<div class="gif-badge">GIF</div>':''}<div class="overlay"></div>`;
    div.addEventListener('click', () => openLightbox(item.url, type));
    gallery.appendChild(div);
  });
}

function openLightbox(url, type) {
  const img = document.getElementById('lightbox-img');
  const vid = document.getElementById('lightbox-vid');
  img.style.display = 'none'; vid.style.display = 'none';
  if (type === 'video') { document.getElementById('lightbox-vid-src').src = url; vid.load(); vid.style.display = 'block'; }
  else { img.src = url; img.style.display = 'block'; }
  document.getElementById('lightbox').classList.add('open');
}

const closeLB = () => { document.getElementById('lightbox').classList.remove('open'); document.getElementById('lightbox-vid').pause(); };
document.getElementById('lightbox-close').addEventListener('click', closeLB);
document.getElementById('lightbox').addEventListener('click', e => { if (e.target === document.getElementById('lightbox')) closeLB(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLB(); });

document.querySelectorAll('.filter-pill button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-pill button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    render();
  });
});

fetchMedia();
</script>
</body>
</html>
